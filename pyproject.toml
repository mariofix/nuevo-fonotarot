[project]
name = "nuevo-fonotarot"
version = "0.1.4"
requires-python = ">=3.14,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-admin[images,sqlalchemy-with-utils,translation] @ git+https://github.com/mariofix/flask-admin.git@autolinks",
    "flask-security[babel,common,fsqla] (>=5.8.1,<7.0.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "flask-limiter[cli] (>=4.1.1,<5.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "pyflowcl (>=2026.5.0,<2027.0.0)",
    "khipu-tools (>=2025.1.0,<2026.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "flask-debugtoolbar-extrapanels @ git+https://github.com/mariofix/flask-debugtoolbar-extrapanels.git@sandbox",
    "daleks[contrib] @ git+https://github.com/mariofix/daleks.git",
    "requests[security] (>=2.34.2,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "ephem (>=4.2.1,<5.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "merchants-sdk @ git+https://github.com/mariofix/merchants.git@main",
    "flask-merchants @ git+https://github.com/mariofix/flask-merchants.git@main",
    "flask-cors (>=6.0.5,<7.0.0)",
    "weasyprint (>=69.0,<70.0)",
    "sentry-sdk (>=2.66.0,<3.0.0)",
    "pywebpush (>=2.3.0,<3.0.0)",
]

[project.scripts]
start = "nuevo_fonotarot:create_app"

[project.optional-dependencies]
dev = [
    "pytest-flask (>=1.3.0,<2.0.0)",
    "black (>=26.5.1,<29.0.0)",
    "pre-commit (>=4.6.0,<6.0.0)",
    "coverage (>=7.15.2,<9.0.0)",
    "ruff (>=0.15.22,<1.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.black]
line-length = 119
