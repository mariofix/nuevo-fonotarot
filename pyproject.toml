[project]
name = "nuevo-fonotarot"
version = "0.1.2"
requires-python = ">=3.13,<4.0"
dependencies = [
  "flask>=3.1.3",
  "flask-admin[images,sqlalchemy-with-utils,translation] (>=2.1.0,<3.0.0)",
  "flask-security[babel,common,fsqla] (>=5.8.0,<6.0.0)",
  "python-slugify (>=8.0.4,<9.0.0)",
  "python-dotenv (>=1.2.2,<2.0.0)",
  "flask-limiter (>=4.1.1,<5.0.0)",
  "flask-migrate (>=4.1.0,<5.0.0)",
  "pyflowcl (>=2026.3.0,<2027.0.0)",
  "khipu-tools (>=2025.1.0,<2026.0.0)",
  "flask-debugtoolbar (>=0.16.0,<0.17.0)",
  "pymysql (>=1.1.3,<2.0.0)",
  "flask-debugtoolbar-extrapanels @ git+https://github.com/mariofix/flask-debugtoolbar-extrapanels.git@sandbox",
  "merchants-sdk @ git+https://github.com/mariofix/merchants.git@main",
  "flask-merchants @ git+https://github.com/mariofix/flask-merchants.git@main",
  "daleks[contrib] @ git+https://github.com/mariofix/daleks.git",
  "flask-admin-tabler  @ git+https://github.com/mariofix/flask-admin-tablerui.git@main",
  "requests (>=2.33.1,<3.0.0)",
  "gunicorn (>=25.3.0,<27.0.0)",
  "ephem (>=4.2.1,<5.0)",
  "cryptography (>=48.0.0,<49.0.0)",
  "webauthn (>=2.7.1,<3.0.0)",
]

[project.scripts]
start = "nuevo_fonotarot:create_app"

[project.optional-dependencies]
dev = ["pytest-flask (>=1.3.0,<2.0.0)", "black (>=26.3.1,<27.0.0)", "pre-commit (>=4.6.0,<5.0.0)", "coverage (>=7.14.0,<8.0.0)", "ruff (>=0.15.13,<0.16.0)", "httpx (>=0.28.1,<0.29.0)"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
